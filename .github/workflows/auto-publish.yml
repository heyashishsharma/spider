name: Instagram Auto-Publisher Cron

on:
  schedule:
    # Runs every day at 14:00 UTC (10:00 AM EST)
    - cron: '0 14 * * *'
  # Allows you to trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Publish API
        run: |
          curl -X GET "${{ secrets.PRODUCTION_URL }}/api/cron/publish" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"
